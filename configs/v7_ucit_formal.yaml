schema_version: 1
purpose: v7_ucit_formal
method_config: configs/v7_global_coevolution.yaml

data:
  model_path: /data/ckpt/zhaozhuofan/models/llava-v1.5-7b
  vision_tower: /data/ckpt/zhaozhuofan/models/clip-vit-large-patch14-336
  projector_path: /data/ckpt/zhaozhuofan/models/llava-v1.5-7b/mm_projector.bin
  image_folder: /data/dataset/zhaozhuofan/UCIT/datasets

# Validation files are deliberately separate from the repository's official
# test_3000 files. The launcher fails before Task0 if these declared files have
# not been prepared and audited; it never substitutes test data.
tasks:
  - task_index: 0
    name: ImageNet-R
    train_file: /data/dataset/zhaozhuofan/UCIT/instructions/ImageNet-R/train.json
    validation_file: /data/dataset/zhaozhuofan/UCIT/v7_validation/ImageNet-R/validation.json
    validation_metric: official_ucit
    validation_annotation_file: /data/dataset/zhaozhuofan/UCIT/v7_validation/ImageNet-R/validation.json
    test_file: /data/dataset/zhaozhuofan/UCIT/instructions/ImageNet-R/test_3000.json
  - task_index: 1
    name: ArxivQA
    train_file: /data/dataset/zhaozhuofan/UCIT/instructions/ArxivQA/train_4w.json
    validation_file: /data/dataset/zhaozhuofan/UCIT/v7_validation/ArxivQA/validation.json
    validation_metric: official_ucit
    validation_annotation_file: /data/dataset/zhaozhuofan/UCIT/v7_validation/ArxivQA/validation.json
    test_file: /data/dataset/zhaozhuofan/UCIT/instructions/ArxivQA/test_3000.json
  - task_index: 2
    name: VizWiz
    train_file: /data/dataset/zhaozhuofan/UCIT/instructions/VizWiz/train.json
    validation_file: /data/dataset/zhaozhuofan/UCIT/v7_validation/VizWiz/validation.json
    validation_metric: official_ucit
    validation_annotation_file: /data/dataset/zhaozhuofan/UCIT/v7_validation/VizWiz/validation_coco.json
    test_file: /data/dataset/zhaozhuofan/UCIT/instructions/VizWiz/test_3000.json
  - task_index: 3
    name: IconQA
    train_file: /data/dataset/zhaozhuofan/UCIT/instructions/IconQA/train.json
    validation_file: /data/dataset/zhaozhuofan/UCIT/v7_validation/IconQA/validation.json
    validation_metric: official_ucit
    validation_annotation_file: /data/dataset/zhaozhuofan/UCIT/v7_validation/IconQA/validation.json
    test_file: /data/dataset/zhaozhuofan/UCIT/instructions/IconQA/test_3000.json
  - task_index: 4
    name: CLEVR
    train_file: /data/dataset/zhaozhuofan/UCIT/instructions/CLEVR/train_4w.json
    validation_file: /data/dataset/zhaozhuofan/UCIT/v7_validation/CLEVR/validation.json
    validation_metric: official_ucit
    validation_annotation_file: /data/dataset/zhaozhuofan/UCIT/v7_validation/CLEVR/validation.json
    test_file: /data/dataset/zhaozhuofan/UCIT/instructions/CLEVR/test_3000.json
  - task_index: 5
    name: Flickr30k
    train_file: /data/dataset/zhaozhuofan/UCIT/instructions/Flickr30k/train_brief_4w.json
    validation_file: /data/dataset/zhaozhuofan/UCIT/v7_validation/Flickr30k/validation.json
    validation_metric: official_ucit
    validation_annotation_file: /data/dataset/zhaozhuofan/UCIT/v7_validation/Flickr30k/validation_coco.json
    test_file: /data/dataset/zhaozhuofan/UCIT/instructions/Flickr30k/test_3000.json
