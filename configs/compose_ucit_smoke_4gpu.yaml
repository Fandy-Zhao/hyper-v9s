# Compose UCIT 4-GPU smoke configuration (spec §24).
#
# Same method protocol as configs/compose_ucit.yaml (frozen official
# config) except the *scale* of the pilot: teacher-search train/val
# samples and the per-task test sets are tiny, and training runs 1 epoch.
# Everything else (task order, teacher/residual/router/clustering/
# key_learning/rms/lora hyperparameters, effective global batch, LR,
# warmup, scheduler, seed) is byte-identical to the official config.
#
# Deep-merged over DEFAULT_CONFIG in compose/experiments/task_run.py,
# exactly like the official config. Test files are 32-record slices of
# the official test_3000 files (data/smoke_4gpu/).

schema_version: 1
purpose: compose_ucit_smoke_4gpu

data:
  seed: 42
  data_root: /data/dataset/zhaozhuofan/UCIT
  images_root: /data/dataset/zhaozhuofan/UCIT/datasets
  base_model: /data/ckpt/zhaozhuofan/models/llava-v1.5-7b
  vision_tower: /data/ckpt/zhaozhuofan/models/clip-vit-large-patch14-336

task_sequence:
  - task_id: 0
    name: ImageNet-R
    train_instructions: /data/dataset/zhaozhuofan/UCIT/instructions/ImageNet-R/train.json
    # 64-record slice: spec §19 requires the eval-parity check to run 64
    # test samples single-GPU vs 4-GPU, and task0's S11 is that check's
    # 4-GPU leg. Tasks 1-5 keep 32-record slices (spec §24 test range).
    test_instructions: /home/zhaozhuofan/Hyper-LlaVA/data/smoke_4gpu/parity64.json
  - task_id: 1
    name: ArxivQA
    train_instructions: /data/dataset/zhaozhuofan/UCIT/instructions/ArxivQA/train_4w.json
    test_instructions: /home/zhaozhuofan/Hyper-LlaVA/data/smoke_4gpu/test_1.json
  - task_id: 2
    name: VizWiz
    train_instructions: /data/dataset/zhaozhuofan/UCIT/instructions/VizWiz/train.json
    test_instructions: /home/zhaozhuofan/Hyper-LlaVA/data/smoke_4gpu/test_2.json
  - task_id: 3
    name: IconQA
    train_instructions: /data/dataset/zhaozhuofan/UCIT/instructions/IconQA/train.json
    test_instructions: /home/zhaozhuofan/Hyper-LlaVA/data/smoke_4gpu/test_3.json
  - task_id: 4
    name: CLEVR
    train_instructions: /data/dataset/zhaozhuofan/UCIT/instructions/CLEVR/train_4w.json
    test_instructions: /home/zhaozhuofan/Hyper-LlaVA/data/smoke_4gpu/test_4.json
  - task_id: 5
    name: Flickr30k
    train_instructions: /data/dataset/zhaozhuofan/UCIT/instructions/Flickr30k/train_brief_4w.json
    test_instructions: /home/zhaozhuofan/Hyper-LlaVA/data/smoke_4gpu/test_5.json

tasks:
  teacher_search_train_samples: 64
  teacher_search_validation_samples: 16

teacher:
  lambda_expert: 0.01
  delta_pair_raw: 0.02
  top_k_for_pair: 4
  max_pairs: 6
  min_recall_audit_ratio: 0.05

residual:
  tau_res: 2.0
  min_residual_samples: 8

router:
  top_m: 8
  tau_none: 0.5
  tau_second: 0.5
  max_active_experts: 2
  query_dim: 128
  key_mode: learnable

clustering:
  max_clusters: 4
  silhouette_threshold: 0.15
  min_cluster_samples: 8
  random_seed: 42
  max_iterations: 100
  silhouette_sample_size: 2000

key_learning:
  learning_rate: 3.0e-4
  epochs: 50
  temperature: 0.07
  margin: 0.3
  lambda_old: 0.5
  lambda_div: 0.1
  key_separation_margin: 0.1
  batch_size: 256
  seed: 42

rms:
  epsilon: 1.0e-8
  kappa_min: 0.25
  kappa_max: 4.0

lora:
  rank: 8
  alpha: 16.0

training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  num_train_epochs: 1
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  logging_steps: 1
  save_steps: 999999
  model_max_length: 2048
  gradient_checkpointing: true
  dataloader_num_workers: 0
  cache_dir: /tmp/compose_hf_cache

eval:
  max_new_tokens: 128
  nll_batch_size: 8
